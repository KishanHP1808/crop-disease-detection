version: '3.8'

services:
  web:
    build: .
    command: gunicorn agriguard_backend.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=0
      - SECRET_KEY=production-secret-key-agriguard-ai-2026
      - DATABASE_URL=postgres://agriguard_user:agriguard_pass@db:5432/agriguard_db
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=agriguard_db
      - POSTGRES_USER=agriguard_user
      - POSTGRES_PASSWORD=agriguard_pass

volumes:
  postgres_data:
  static_volume:
  media_volume:
