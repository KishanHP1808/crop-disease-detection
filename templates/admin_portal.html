<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ AgriGuard AI — Admin Portal Access</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/images/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/images/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0a190f, #1b5e20);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            color: #ffffff;
        }
        .admin-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            padding: 40px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .btn-verify {
            background: linear-gradient(135deg, #2E7D32, #1b5e20);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-verify:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <div style="font-size: 3.8rem; margin-bottom: 10px;">🛡️</div>
        <h2 style="margin: 0; font-size: 1.8rem; font-weight: 800; color: #aed581;">AgriGuard AI</h2>
        <h3 style="margin: 4px 0 16px 0; font-size: 1.2rem; font-weight: 600; color: #ffffff;">Admin Control Panel</h3>
        <p style="font-size: 0.95rem; color: rgba(255, 255, 255, 0.85); margin-bottom: 28px;">
            Direct admin access enabled. Redirecting to Admin Control Panel...
        </p>

        <a href="/admin/" class="btn-verify">🔓 Enter Admin Control Panel</a>

        <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.15); text-align: center; font-size: 0.85rem;">
            <a href="/" style="color: #aed581; text-decoration: none; font-weight: 700;">🌾 Return to Farmer Portal</a>
        </div>
    </div>

    <script>
        // Auto-redirect to admin panel
        window.location.href = '/admin/';
    </script>
</body>
</html>
